<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Smart Job Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard">
  <header class="subpage-header">
    <div>
      <p class="eyebrow">Workspace</p>
      <h1 id="dashboardHeading">Manage your profile and hiring activity</h1>
    </div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="jobs.html">Jobs</a>
      <button id="logoutButton" class="button-link ghost type-button" type="button">Logout</button>
    </div>
  </header>

  <main class="page-section dashboard-layout">
    <section class="card-shell">
      <h2>Profile</h2>
      <form id="profileForm" class="stack-form" enctype="multipart/form-data">
        <div class="form-group">
          <label for="profileName">Name</label>
          <input id="profileName" name="name" type="text" required>
        </div>
        <div class="form-group">
          <label for="profileEmail">Email</label>
          <input id="profileEmail" name="email" type="email" disabled>
        </div>
        <div class="form-group">
          <label for="profileRole">Role</label>
          <input id="profileRole" name="role" type="text" disabled>
        </div>
        <div class="form-group">
          <label for="profileSkills">Skills</label>
          <textarea id="profileSkills" name="skills" rows="3" placeholder="Add skills separated by commas"></textarea>
        </div>
        <div class="form-group">
          <label for="profileResumeFile">Resume</label>
          <input id="profileResumeFile" name="resume" type="file" accept=".pdf,.doc,.docx">
        </div>
        <div class="form-group">
          <label for="profileResume">Current resume link</label>
          <input id="profileResume" name="resumeLink" type="text" disabled>
        </div>
        <button type="submit" class="primary-btn">Save profile</button>
        <p id="profileMessage" class="form-message"></p>
      </form>
    </section>

    <section id="studentDashboard" class="dashboard-panel hidden">
      <div class="card-shell">
        <h2>Applied jobs</h2>
        <div id="studentApplications" class="data-list"></div>
      </div>
    </section>

    <section id="companyDashboard" class="dashboard-panel hidden">
      <div class="card-shell">
        <h2>Create job or internship</h2>
        <form id="jobForm" class="stack-form">
          <div class="form-group">
            <label for="jobTypeSelect">Type</label>
            <select id="jobTypeSelect" name="job_type" required>
              <option value="job">Full-time / Job</option>
              <option value="internship">Internship</option>
            </select>
          </div>
          <div class="form-group">
            <label for="jobTitle">Title</label>
            <input id="jobTitle" name="title" type="text" required>
          </div>
          <div class="form-group">
            <label for="jobCompany">Company</label>
            <input id="jobCompany" name="company" type="text" required>
          </div>
          <div class="form-group">
            <label for="jobLocation">Location</label>
            <input id="jobLocation" name="location" type="text" required>
          </div>
          <div class="form-group">
            <label for="jobSkills">Skills required</label>
            <input id="jobSkills" name="skills_required" type="text" placeholder="React, SQL, Communication" required>
          </div>
          <div class="form-group">
            <label for="jobSalary">Salary / Stipend</label>
            <input id="jobSalary" name="salary" type="text" placeholder="4.5 LPA / 15000 per month" required>
          </div>
          <div class="form-group">
            <label for="jobDescription">Description</label>
            <textarea id="jobDescription" name="description" rows="4" required></textarea>
          </div>
          <button type="submit" class="primary-btn">Publish role</button>
          <p id="jobMessage" class="form-message"></p>
        </form>
      </div>

      <div class="card-shell">
        <h2>Posted roles</h2>
        <div id="companyJobs" class="data-list"></div>
      </div>

      <div class="card-shell">
        <h2>Applicants</h2>
        <div id="companyApplications" class="data-list"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
