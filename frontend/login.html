<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Smart Job Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
  <main class="auth-layout">
    <section class="auth-panel intro-panel">
      <p class="eyebrow">Welcome Back</p>
      <h1>Stay close to your hiring pipeline.</h1>
      <p>Students can manage applications and companies can review applicants, posted roles, and hiring activity from one account.</p>
      <a href="register.html" class="button-link ghost">Create account</a>
    </section>

    <section class="auth-panel form-panel">
      <form id="loginForm" class="form-card">
        <h2>Sign in</h2>
        <div class="form-group">
          <label for="loginEmail">Email address</label>
          <input id="loginEmail" name="email" type="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" name="password" type="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="primary-btn">Login</button>
        <p id="loginMessage" class="form-message"></p>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
